<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling Your First Page</title>
    <!-- Đường dẫn tới file CSS chung của bạn -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Yêu cầu 2: Thêm thẻ a dẫn tới phần nội dung chính -->
    <a href="#main" class="skip-link">Skip to Main Content</a>

    <header>
        <h1>Tiêu đề trang web</h1>
        <nav>
            <!-- Menu điều hướng -->
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="neighborhood.html">Neighborhood</a></li>
                <li><a href="parks.html">Parks</a></li>
            </ul>
            <img src="images/logo.png" alt="Logo">
        </nav>
    </header>

    <!-- Yêu cầu 2: Thêm id="main" vào thẻ main -->
    <main id="main">
        <section class="grid">
            <h2>Phần nội dung lưới (Grid)</h2>
            <p>Đoạn văn bản mô tả nội dung...</p>
            <img src="images/sample.jpg" alt="Sample image">
        </section>

        <section class="flex">
            <h2>Phần nội dung linh hoạt (Flex)</h2>
            <p>Đoạn văn bản mô tả nội dung...</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

</body>
</html>
